<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- transparante achtergrond -->
  <rect width="400" height="120" fill="none"/>

  <!-- GROTE kookpot -->
  <g transform="translate(20,28)">
    <!-- pot body -->
    <rect x="0" y="35" width="110" height="60" rx="10" fill="#0F225A"/>
    <!-- rim -->
    <rect x="-8" y="22" width="126" height="18" rx="9" fill="#1B3178"/>
    <!-- handles -->
    <rect x="-18" y="40" width="10" height="38" rx="5" fill="#0F225A"/>
    <rect x="110" y="40" width="10" height="38" rx="5" fill="#0F225A"/>
    <!-- steam -->
    <path d="M30 18 C18 2, 30 -4, 40 -4" stroke="#FFB347" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M65 18 C53 2, 65 -4, 75 -4" stroke="#FFB347" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- COOKLAB tekst - volledig binnen viewBox -->
  <text
    x="180"
    y="80"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="40"
    font-weight="800"
    letter-spacing="4"
    fill="#0B1B4A">
    COOKLAB
  </text>
</svg>
